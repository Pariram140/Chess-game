name: React CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'chore/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: CI=true npm test -- --watchAll=false

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright in an isolated directory
        run: |
          npm install --prefix .playwright --no-save --package-lock=false @playwright/test@1.58.2
          ./.playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Run Playwright functional tests
        run: NODE_PATH="$GITHUB_WORKSPACE/.playwright/node_modules" ./.playwright/node_modules/.bin/playwright test

      - name: Upload Playwright failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify-render-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Render to publish this commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOYMENT_INFO_URL: https://pari-chess-game.onrender.com/deployment-info.json
        run: |
          for attempt in $(seq 1 20); do
            response=$(curl --fail --silent --show-error --max-time 10 "${DEPLOYMENT_INFO_URL}?run=${GITHUB_RUN_ID}&attempt=${attempt}" 2>/dev/null || true)
            actual_commit=$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).commit || '')}catch{process.stdout.write('')}})")
            if [ "$actual_commit" = "$EXPECTED_COMMIT" ]; then
              echo "Render is serving expected commit $EXPECTED_COMMIT"
              exit 0
            fi
            echo "Render has not published expected commit yet (attempt $attempt/20; current: ${actual_commit:-unavailable})"
            sleep 30
          done
          echo "::error::Render did not publish main commit $EXPECTED_COMMIT within 10 minutes. Check Render auto-deploy configuration and events."
          exit 1
