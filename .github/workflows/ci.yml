name: React CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'chore/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: CI=true npm test -- --watchAll=false

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright in an isolated directory
        run: |
          npm install --prefix .playwright --no-save --package-lock=false @playwright/test@1.58.2
          ./.playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Run Playwright functional tests
        run: NODE_PATH="$GITHUB_WORKSPACE/.playwright/node_modules" ./.playwright/node_modules/.bin/playwright test

      - name: Upload Playwright failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
