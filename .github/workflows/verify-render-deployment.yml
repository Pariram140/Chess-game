name: Verify Render Deployment

on:
  workflow_run:
    workflows: ["React CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify-render-deployment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Render to publish the tested commit
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          DEPLOYMENT_INFO_URL: https://pari-chess-game-docker.onrender.com/deployment-info.json
        run: |
          for attempt in $(seq 1 20); do
            response=$(curl --fail --silent --show-error --max-time 10 "${DEPLOYMENT_INFO_URL}?run=${GITHUB_RUN_ID}&attempt=${attempt}" 2>/dev/null || true)
            actual_commit=$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).commit || '')}catch{process.stdout.write('')}})")
            if [ "$actual_commit" = "$EXPECTED_COMMIT" ]; then
              echo "Render is serving expected commit $EXPECTED_COMMIT"
              exit 0
            fi
            echo "Render has not published expected commit yet (attempt $attempt/20; current: ${actual_commit:-unavailable})"
            sleep 30
          done
          echo "::error::Render did not publish main commit $EXPECTED_COMMIT within 10 minutes. Check Render Blueprint sync, auto-deploy configuration, and events."
          exit 1
